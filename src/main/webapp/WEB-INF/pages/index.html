<!DOCTYPE html>
<html xmlns:th="thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Навигация</title>
    <style>
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        .btn-list {
            display: inline-block;
            padding: 12px 24px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .btn-list:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <a th:href="@{/users}" class="btn-list">Перейти к списку пользователей</a>
</div>

</body>
</html>
