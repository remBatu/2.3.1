<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Car List</title>
    <style>
        table { width: 50%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

<h2>Cars</h2>

<table>
    <thead>
    <tr>
        <th>Model</th>
        <th>Color</th>
        <th>Release Year</th>
    </tr>
    </thead>
    <tbody>
    <!-- Цикл по списку cars. Переменная car — это текущий объект в итерации -->
    <tr th:each="car : ${cars}">
        <td th:text="${car.model}">Model</td>
        <td th:text="${car.color}">Color</td>
        <td th:text="${car.yearOfRelease}">Year</td>
    </tr>
    </tbody>
</table>

</body>
</html>
